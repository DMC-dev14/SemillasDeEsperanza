<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Recuperar Contraseña</h2>
    <h3><span>Hola</span><span th:text="${userName}"></span></h3>
    <h4>Haz click en el siguiente enlace para acceder a tu cuenta</h4>
    <a
      href="" th:href="${url}"
      target="_blank"
      style="
        display: inline-block;
        padding: 12px 24px;
        background-color: #2e7d32;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      "
    >
      Ir a mi cuenta
    </a>
  </body>
</html>
