spring.application.name=app
# 1. URL de conexión (reemplaza 'nombre_base_datos' por el tuyo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/semillas_esperanza?serverTimezone=UTC}

# 2. Credenciales de acceso a tu MySQL (usar variables de entorno en producción)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# 3. Driver oficial de MySQL para Java
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Controla qué hace Hibernate con las tablas al iniciar la app (update solo actualiza los cambios)
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de Spring Boot las consultas SQL reales que se están ejecutando
spring.jpa.show-sql=true

# Formatea el código SQL de la consola para que sea fácil de leer
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSeguraParaProduccion12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.admin.email=${APP_ADMIN_EMAIL:admin@semillas.org}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123}

# Thymeleaf (sin cache en desarrollo para ver cambios en caliente)
spring.thymeleaf.cache=false

