
<div class="user-avatar-container" [class.editable]="editable()">
  <div class="avatar-wrapper" [class]="sizeClass">
    @if (hasImage) {
      <img
        [src]="imageUrl()"
        [alt]="alt()"
        class="avatar-image"
        loading="lazy"
        (error)="onImageError($event)"
      />
    } @else {
      <div class="avatar-placeholder">
        {{ initials }}
      </div>
    }
  </div>
  @if (editable()) {
    <input
      #fileInput
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      (change)="onFileSelected($event)"
      hidden
    />
    <div class="avatar-controls">
      <button
        type="button"
        class="avatar-control-btn"
        (click)="triggerFileInput(fileInput)"
        [disabled]="isUploading()"
      >
        @if (isUploading()) {
          Subiendo...
        } @else {
          {{ hasImage ? '✏️ Cambiar' : '📷 Subir foto' }}
        }
      </button>
      @if (hasImage) {
        <button
          type="button"
          class="avatar-control-btn avatar-control-delete"
          (click)="removeAvatar()"
          [disabled]="isUploading()"
        >
          🗑️ Eliminar
        </button>
      }
    </div>
  }
  @if (uploadError()) {
    <div class="avatar-error" role="alert">
      {{ uploadError() }}
    </div>
  }
</div>
