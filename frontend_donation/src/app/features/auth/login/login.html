
<form [formGroup]="loginForm" (ngSubmit)="login()">

  <!-- Mensaje de error -->
  <div *ngIf="serverError()" class="text-red-600 text-sm mb-4 text-center">
    {{ serverError() }}
  </div>

  <!-- Correo electrónico -->
  <div class="mb-4">
    <label for="email" class="block text-xs font-semibold text-[#5A4A3F] mb-1.5">
      Correo electrónico
    </label>

    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="maria@correo.com"
      autocomplete="email"
      class="w-full px-4 py-3 border-2 rounded-xl bg-[#F9F8F0] text-[#3A2A20] text-sm outline-none focus:border-[#3D6B35] transition-colors"
      [ngClass]="{
        'border-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched,
        'border-[#3D6B35]': loginForm.get('email')?.valid,
        'border-[#C8D4B0]': !loginForm.get('email')?.touched
      }"
    />

    <div
      *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      class="text-red-500 text-xs mt-1"
    >
      <span *ngIf="loginForm.get('email')?.errors?.['required']">
        El email es requerido
      </span>
      <span *ngIf="loginForm.get('email')?.errors?.['email']">
        El email no es válido
      </span>
    </div>
  </div>

  <!-- Contraseña -->
  <div class="mb-4">
    <label for="password" class="block text-xs font-semibold text-[#5A4A3F] mb-1.5">
      Contraseña
    </label>

    <input
      id="password"
      type="password"
      formControlName="password"
      placeholder="••••••••"
      autocomplete="current-password"
      class="w-full px-4 py-3 border-2 rounded-xl bg-[#F9F8F0] text-[#3A2A20] text-sm outline-none focus:border-[#3D6B35] transition-colors"
      [ngClass]="{
        'border-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched,
        'border-[#3D6B35]': loginForm.get('password')?.valid,
        'border-[#C8D4B0]': !loginForm.get('password')?.touched
      }"
    />

    <div
      *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      class="text-red-500 text-xs mt-1"
    >
      La contraseña es requerida
    </div>
  </div>

  <!-- Opciones adicionales -->
  <div class="flex items-center justify-between mb-6">
    <label class="flex items-center gap-2 text-sm text-[#5A4A3F] cursor-pointer select-none">
      <input
        type="checkbox"
        formControlName="rememberMe"
        class="rounded border-[#C8D4B0] accent-[#3D6B35] h-4 w-4"
      />
      Recordarme
    </label>

    <a
      routerLink="/recuperar-password"
      class="text-sm text-[#3D6B35] font-semibold hover:underline"
    >
      ¿Olvidaste tu contraseña?
    </a>
  </div>

  <!-- Botón de envío -->
  <button
    type="submit"
    [disabled]="loginForm.invalid"
    class="w-full py-3 px-6 bg-gradient-to-r from-[#3D6B35] to-[#7C9A3E] text-white font-poppins font-semibold text-base rounded-xl shadow-md hover:opacity-95 hover:scale-[1.01] transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    Iniciar sesión
  </button>

</form>
